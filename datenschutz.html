  function setLang(lang) {
    const c = C[lang] || C.en;
    document.documentElement.setAttribute('lang', c.lang);
    document.documentElement.setAttribute('dir', c.dir);
    document.body.setAttribute('dir', c.dir);
    document.getElementById('back-label').textContent = c.back;
    document.getElementById('doc-label').textContent = c.label;
    document.getElementById('title').textContent = c.title;
    document.getElementById('doc-date').textContent = c.date;
    document.getElementById('content').innerHTML = c.html;
    document.querySelectorAll('.lang-pill').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
    });
    document.title = 'HYBOTE – ' + c.title;
  }

  const params = new URLSearchParams(window.location.search);
  const initLang = C[params.get('lang')] ? params.get('lang') : 'en';
  setLang(initLang);
</script>
