<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYBOTE – Thank you</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="/fonts/fonts.css" rel="stylesheet" />
  <style>
    :root {
      --bg:       #080d1a;
      --s1:       #0f1629;
      --s2:       #162040;
      --s3:       #1e2a52;
      --gold:     #c9a053;
      --gold-lt:  #e8c47a;
      --teal:     #4ecdc4;
      --fg:       #f5f1eb;
      --a1:       #d4cfc8;
      --a2:       #b0a898;
      --a3:       #8b95aa;
      --a4:       #566070;
      --line:     rgba(255,255,255,0.06);
      --line-med: rgba(255,255,255,0.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--fg); }
    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: radial-gradient(ellipse 100% 80% at 50% 0%, rgba(201,160,83,0.06) 0%, transparent 60%), var(--bg);
    }
    body[dir="rtl"] { font-family: 'Cairo', sans-serif; }
    .wrap {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo {
      display: inline-block;
      margin-bottom: 64px;
    }
    .check-circle {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      background: rgba(201,160,83,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    h1 {
      font-family: 'Cormorant Garamond', 'Montserrat', serif;
      font-weight: 300;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 20px;
    }
    p {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--a3);
      margin-bottom: 40px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--gold) 0%, #b8893a 50%, var(--gold-lt) 100%);
      color: #080d1a;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,160,83,0.3); }
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin: 48px auto;
    }
    .footer-note {
      font-size: 0.72rem;
      color: var(--a4);
      letter-spacing: 0.06em;
    }
    .footer-note a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="HYBOTE" style="height:52px;width:auto;display:block;margin:0 auto;filter:invert(1);" />
    </a>

    <div class="check-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <h1 id="title">Your enquiry has been received.</h1>
    <p id="subtitle">Your request has been received. We will get back to you using the details you provided.</p>

    <a href="index.html" class="btn" id="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="back-label">Back to homepage</span>
    </a>

    <div class="divider"></div>
    <p class="footer-note" id="footer-note">© 2026 HYBOTE · <a href="mailto:Contact@hybote.ai">Contact@hybote.ai</a></p>
  </div>

  <script>
    const content = {
      de: {
        title: 'Ihre Anfrage ist eingegangen.',
        subtitle: 'Ihre Anfrage ist eingegangen. Wir melden uns über die angegebenen Kontaktdaten bei Ihnen.',
        back: 'Zurück zur Startseite',
        docTitle: 'HYBOTE – Vielen Dank'
      },
      en: {
        title: 'Your enquiry has been received.',
        subtitle: 'Your request has been received. We will get back to you using the details you provided.',
        back: 'Back to homepage',
        docTitle: 'HYBOTE – Thank you'
      },
      ar: {
        title: 'تم استلام استفساركم.',
        subtitle: 'تم استلام طلبك. سنتواصل معك باستخدام البيانات التي قدمتها.',
        back: 'العودة إلى الصفحة الرئيسية',
        docTitle: 'HYBOTE – شكراً'
      }
    };

    const params = new URLSearchParams(window.location.search);
    const lang = content[params.get('lang')] ? params.get('lang') : 'en';
    const t = content[lang];

    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('back-label').textContent = t.back;
    document.getElementById('footer-note').innerHTML = '© 2026 HYBOTE · <a href="mailto:Contact@hybote.ai" style="color:inherit;">Contact@hybote.ai</a>';
    document.title = t.docTitle;
    document.querySelectorAll('a[href="index.html"]').forEach(a => a.href = '/?lang=' + lang);
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    if (lang === 'ar') document.body.setAttribute('dir', 'rtl');
  </script>
</body>
</html>
