<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYBOTE | Thank you</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b16" />
  <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link href="/fonts/fonts.css" rel="stylesheet" />
  <!-- Vercel Web Analytics (cookiefrei): Aufrufe dieser Seite zählen als Buchung bzw. Anfrage -->
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    /* Dankesseite (Neugestaltung „Der Concierge“ 26.10.2026): nach der Buchung über Calendly (?via=calendly,
       die Startseite leitet nach calendly.event_scheduled hierher) oder nach dem Kontaktformular. Hintergrund:
       der Concierge im Morgengrauen, darüber eine Glaskarte. Tokens wie auf der Startseite. */
    :root {
      --bg: #070b16;
      --s1: #0c1222;
      --s2: #131b30;
      --s3: #1c2740;
      --accent: #38BDF8;
      --accent-lt: #7DD3FC;
      --fg: #f5f1eb;
      --a1: #d4cfc8;
      --a3: #8b95aa;
      --glass: rgba(12, 18, 34, 0.62);
      --glass-hi: rgba(255, 255, 255, 0.2);
      --glass-edge: rgba(255, 255, 255, 0.09);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Montserrat', system-ui, sans-serif;
      --gutter: clamp(16px, 4.6vw, 56px);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    html[lang="ar"] { --serif: 'Cairo', sans-serif; --sans: 'Cairo', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    /* Grund auf html: ein Hintergrund auf body läge über dem Bild (.bg, z-index -1) */
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: transparent;
      color: var(--fg);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    h1, p, ol { margin: 0; }
    ol { padding: 0; list-style: none; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Bild bildfüllend, links und unten in den Grund verlaufend; im Arabischen gespiegelt */
    .bg { position: fixed; inset: 0; z-index: -1; }
    .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 78% 40%; }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(7, 11, 22, 0.92) 0%, rgba(7, 11, 22, 0.7) 38%, rgba(7, 11, 22, 0.1) 70%, rgba(7, 11, 22, 0.25) 100%),
        linear-gradient(0deg, var(--bg) 0%, rgba(7, 11, 22, 0) 30%);
    }
    html[dir="rtl"] .bg img { transform: scaleX(-1); }
    html[dir="rtl"] .bg::after {
      background:
        linear-gradient(270deg, rgba(7, 11, 22, 0.92) 0%, rgba(7, 11, 22, 0.7) 38%, rgba(7, 11, 22, 0.1) 70%, rgba(7, 11, 22, 0.25) 100%),
        linear-gradient(0deg, var(--bg) 0%, rgba(7, 11, 22, 0) 30%);
    }

    .glass {
      border: 1px solid transparent;
      border-radius: 12px;
      background:
        linear-gradient(var(--glass), var(--glass)) padding-box,
        linear-gradient(180deg, var(--glass-hi), var(--glass-edge) 38%, rgba(255, 255, 255, 0.04)) border-box;
      box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.75);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .top { padding: 14px var(--gutter) 0; }
    .top-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1180px;
      height: 64px;
      margin-inline: auto;
      padding-inline: 24px 8px;
      border-radius: 999px;
    }
    .top-inner img { display: block; height: 17px; width: auto; }
    .lang { display: flex; gap: 2px; }
    .lang a {
      display: grid;
      place-items: center;
      min-width: 40px;
      height: 40px;
      border-radius: 999px;
      color: var(--a3);
      font: 500 0.8125rem/1 'Montserrat', sans-serif;
      letter-spacing: 0.06em;
      text-decoration: none;
    }
    .lang a:hover { color: var(--fg); }
    .lang a[aria-current="true"] { background: rgba(255, 255, 255, 0.09); color: var(--fg); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: calc(1180px + 2 * var(--gutter));
      margin-inline: auto;
      padding: clamp(40px, 8vh, 96px) var(--gutter);
    }
    .card { width: min(100%, 600px); padding: clamp(28px, 4vw, 48px); }
    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin-bottom: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.14), 0 0 40px rgba(56, 189, 248, 0.45);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--a1);
    }
    .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.6rem, 5.4vw, 4.4rem);
      line-height: 1;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }
    html[lang="ar"] h1 { line-height: 1.3; letter-spacing: 0; }
    .sub { margin-top: 20px; max-width: 46ch; color: var(--a1); }
    .steps { display: grid; gap: 10px; margin-top: 32px; counter-reset: step; }
    .steps li {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(7, 11, 22, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.07);
      counter-increment: step;
    }
    .steps li::before {
      content: counter(step);
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.26);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--accent-lt);
    }
    .steps b { display: block; font-weight: 500; font-size: 1rem; line-height: 1.4; }
    .steps span { display: block; margin-top: 2px; font-size: 0.9375rem; color: var(--a1); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 26px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.9375rem;
      text-decoration: none;
      transition: background-color 200ms ease, box-shadow 300ms ease;
    }
    .btn--primary { background: var(--accent); color: var(--bg); }
    .btn--primary:hover { background: var(--accent-lt); box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.65); }
    .btn--glass {
      color: var(--fg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(19, 27, 48, 0.42);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .btn--glass:hover { background: rgba(36, 49, 82, 0.6); }
    html[dir="rtl"] .btn svg { transform: scaleX(-1); }

    footer { padding: 0 var(--gutter) 28px; font-size: 0.8125rem; color: var(--a3); }
    footer p { max-width: 1180px; margin-inline: auto; }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise 900ms var(--ease) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    }
    @media (max-width: 767px) {
      .bg img { object-position: 78% 30%; }
      .bg::after, html[dir="rtl"] .bg::after {
        background: linear-gradient(180deg, rgba(7, 11, 22, 0.55) 0%, rgba(7, 11, 22, 0.35) 30%, rgba(7, 11, 22, 0.88) 55%, var(--bg) 80%);
      }
      main { align-items: flex-end; padding-top: 28vh; }
      .top-inner { height: 58px; padding-inline: 18px 6px; }
      .lang a { min-width: 36px; }
      .actions .btn { flex: 1 1 auto; }
    }
    html[lang="ar"] body * { letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="/media/danke-dawn-phone.webp" />
      <img src="/media/danke-dawn.webp" width="1920" height="1072" alt="" fetchpriority="high" />
    </picture>
  </div>

  <header class="top">
    <div class="top-inner glass">
      <a href="/" id="home-logo" aria-label="HYBOTE"><img src="/logo-mobile-white.png" width="2328" height="374" alt="HYBOTE" /></a>
      <nav class="lang" aria-label="Language">
        <a href="?lang=en" data-lang="en">EN</a>
        <a href="?lang=de" data-lang="de">DE</a>
        <a href="?lang=ar" data-lang="ar">AR</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="card glass">
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="eyebrow" id="eyebrow">Received</p>
      <h1 id="title">Your enquiry has been received.</h1>
      <p class="sub" id="subtitle">Your request has been received. We will get back to you using the details you provided.</p>
      <ol class="steps" id="steps" hidden></ol>
      <div class="actions">
        <a href="/" class="btn btn--primary" id="back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          <span id="back-label">Back to homepage</span>
        </a>
        <a href="https://wa.me/12134234114" class="btn btn--glass" target="_blank" rel="noopener" id="wa-btn">WhatsApp</a>
      </div>
    </div>
  </main>

  <footer><p>© 2026 Hybote AI Systems LLC · <a href="mailto:contact@hybote.ai">contact@hybote.ai</a></p></footer>

  <script>
    // Zwei Fassungen: ?via=calendly (Termin gebucht) oder ohne (Anfrage über das Formular eingegangen)
    const content = {
      en: {
        doc: 'HYBOTE | Thank you',
        form: {
          eyebrow: 'Received',
          title: 'Your enquiry has been received.',
          sub: 'Your request has been received. We will get back to you using the details you provided.'
        },
        calendly: {
          eyebrow: 'Booked',
          title: 'Your intro call is booked.',
          sub: 'The confirmation with your Microsoft Teams link is on its way to your inbox. We look forward to speaking with you.',
          steps: [
            ['Check your inbox', 'The confirmation and the calendar invitation arrive within a few minutes.'],
            ['20 minutes on Teams', 'We look at your enquiries and channels together.'],
            ['Your proposal', 'Afterwards you receive a concrete proposal, free of charge.']
          ]
        },
        back: 'Back to homepage'
      },
      de: {
        doc: 'HYBOTE | Vielen Dank',
        form: {
          eyebrow: 'Eingegangen',
          title: 'Ihre Anfrage ist eingegangen.',
          sub: 'Ihre Anfrage ist eingegangen. Wir melden uns über die angegebenen Kontaktdaten bei Ihnen.'
        },
        calendly: {
          eyebrow: 'Gebucht',
          title: 'Ihr Erstgespräch ist gebucht.',
          sub: 'Die Bestätigung mit dem Microsoft-Teams-Link ist auf dem Weg in Ihr Postfach. Wir freuen uns auf das Gespräch.',
          steps: [
            ['Postfach prüfen', 'Bestätigung und Kalendereinladung kommen in wenigen Minuten.'],
            ['20 Minuten per Teams', 'Wir sehen uns gemeinsam Ihre Anfragen und Kanäle an.'],
            ['Ihr Vorschlag', 'Danach erhalten Sie einen konkreten Vorschlag, kostenlos.']
          ]
        },
        back: 'Zurück zur Startseite'
      },
      ar: {
        doc: 'HYBOTE | شكرًا',
        form: {
          eyebrow: 'تم الاستلام',
          title: 'تم استلام استفساركم.',
          sub: 'تم استلام طلبك. سنتواصل معك باستخدام البيانات التي قدمتها.'
        },
        calendly: {
          eyebrow: 'تم الحجز',
          title: 'تم حجز مكالمتك التعريفية.',
          sub: 'التأكيد مع رابط Microsoft Teams في طريقه إلى بريدك الإلكتروني. نتطلع إلى الحديث معك.',
          steps: [
            ['تفقّد بريدك', 'يصلك التأكيد ودعوة التقويم خلال دقائق.'],
            ['20 دقيقة عبر Teams', 'ننظر معًا في استفساراتك وقنواتك.'],
            ['عرضك', 'بعدها تتلقى عرضًا محددًا مجانًا.']
          ]
        },
        back: 'العودة إلى الصفحة الرئيسية'
      }
    };

    const params = new URLSearchParams(window.location.search);
    const lang = content[params.get('lang')] ? params.get('lang') : 'en';
    const via = params.get('via') === 'calendly' ? 'calendly' : 'form';
    const t = content[lang];
    const v = t[via];

    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.title = t.doc;
    document.getElementById('eyebrow').textContent = v.eyebrow;
    document.getElementById('title').textContent = v.title;
    document.getElementById('subtitle').textContent = v.sub;
    document.getElementById('back-label').textContent = t.back;
    if (v.steps) {
      const ol = document.getElementById('steps');
      v.steps.forEach(([head, body]) => {
        const li = document.createElement('li');
        const wrap = document.createElement('div');
        const b = document.createElement('b');
        const s = document.createElement('span');
        b.textContent = head;
        s.textContent = body;
        wrap.append(b, s);
        li.append(wrap);
        ol.append(li);
      });
      ol.hidden = false;
    }
    const home = lang === 'en' ? '/' : '/?lang=' + lang;
    document.getElementById('back-btn').href = home;
    document.getElementById('home-logo').href = home;
    document.querySelectorAll('.lang a').forEach(a => {
      const l = a.dataset.lang;
      a.href = '?lang=' + l + (via === 'calendly' ? '&via=calendly' : '');
      a.setAttribute('aria-current', String(l === lang));
    });
  </script>
</body>
</html>
